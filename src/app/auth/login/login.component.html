<img src='/assets/image/blurred.png' style='height:100%;width:100%;position:absolute;top:0px;left:0px;'/>

<div style="margin:25px;padding:25px;text-align:left;position:absolute;left:30%;top:30%;height:30%;width:40%;border-radious:2px;border:1px solid silver;background-color:white;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">

<table style="margin-left:auto;margin-right:auto;" cellspacing="10px">
	<tr>
		<td colspan="2" style="text-align:center">
	<img src="/assets/image/login_logo.gif"/>
		</td>
	</tr>
	<tr>
		<td style="text-align:right;">Username</td><td style="text-align:left;"><input [(ngModel)]="userName" /></td>
	  </tr>
	<tr>
		<td style="text-align:right;">Password</td><td style="text-align:left;"><input input-type="password'" [(ngModel)]="password" /></td>
	</tr>
	<tr>
		<td></td>
		<td style="text-align:right;">
	  <button (click)="login()"  *ngIf="!authService.isLoggedIn">Login</button>
	  <button (click)="logout()" *ngIf="authService.isLoggedIn">Logout</button>
	   </td>
	</tr>
</table>
<br/>
<span style="font-size:.7em;bottom:15px;position:absolute">Can't login?Click here to reset your password.</span>
</div>

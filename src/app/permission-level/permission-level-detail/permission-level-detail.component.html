<h2>Permission Levels</h2>
<div *ngIf="permissionlevel$ | async as permissionlevel">
  <h3>"{{ permissionlevel.name }}"</h3>
  <div>
    <label>Id: </label>{{ permissionlevel.id }}</div>
  <div>
    <label>Name: </label>
    <input [(ngModel)]="permissionlevel.name" placeholder="name"/>
  </div>
  <p>
    <button (click)="gotoPermissionLevels(permissionlevel)">Back</button>
  </p>
</div>
